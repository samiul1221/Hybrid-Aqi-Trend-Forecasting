[project]
name = "aqi-ml"
version = "0.1.0"
description = "ML library: data, simulator, features, edge students, teacher, distillation, export, eval"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aqi-shared",
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "tensorflow==2.21.0",
    "torch==2.14.1",
]

[tool.uv.sources]
aqi-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqi_ml"]
