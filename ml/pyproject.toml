[project]
name = "aqi-ml"
version = "0.1.0"
description = "ML library: data, simulator, features, edge students, teacher, distillation, export, eval"
requires-python = ">=3.11,<3.12"
dependencies = ["aqi-shared"]

[tool.uv.sources]
aqi-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqi_ml"]
