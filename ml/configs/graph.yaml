# Teacher graph data (CR v2 [R07.2], ADR 0012, ADR 0019). Built by aqi_ml.data.graph_windows.
version: graph-v1
dataset: feat-v1            # student dataset whose hourly.parquet files are the node features (same pipeline, G1)
units: [0, 1, 2]            # one graph "reality" per virtual unit index (I11)
lookback_h: 24
horizon_h: 6                # teacher predicts h1..h6 (I10)
# Open-Meteo (ERA5, pure source: data/interim/open_meteo) columns: past node channels and future covariates.
# blh is null for Delhi (I17); there is no holiday calendar (I18).
om_columns: [t2m, rh2m, sp, u10, v10, precip, swrad]
oracle_weather: true        # X_fut = ERA5 actuals, not issued forecasts (I19) -> report as a limitation
# Static columns [lat, lon, elevation, height_agl, sheltering_factor, is_reference] (I3). For the virtual CPCB
# nodes the last three are constants (no install metadata yet); real nodes will fill them.
static_constants: {height_agl: 3.0, sheltering_factor: 0.0, is_reference: 0.0}
g1_check_windows: 500       # student windows compared bit-for-bit with the teacher grid at build time
