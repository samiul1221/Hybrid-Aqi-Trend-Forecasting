# Teacher variant T2 (CR v2 [R07.6c] ablation T0-T3; ADR 0013). Every key is required (config.load).
name: T2
use_graph: true          # wind-biased GAT over stations (T1-T3)
use_wind: true           # TransNet wind prior instead of 1/d (T2-T3)
use_adr: false            # advection-diffusion-reaction block (T3)
quantiles: true        # q10/q90 heads + pinball loss [R07.6b]
d_model: 64
heads: 4
temporal_layers: 2
dropout: 0.1
d_min_km: 1.0          # [R07.3]
calm_ms: 0.3           # [R07.3] calm wind carries nothing
sigma_km: 10.0         # diffusion graph exp(-d^2/sigma^2)
gat_eps: 0.001         # [R07.5] log(w + eps)
beta_init: 1.0         # [R07.5] learnable prior strength
adr_steps: 2           # K [R07.6]
adr_h: 0.1             # I12: TransNet uses 0.01 on its own scale; test {0.01, 0.1}
graph_version: graph-v1
units: [0, 1, 2]
batch: 16              # graphs per step [R07.6c]
lr: 0.001
weight_decay: 0.0001
grad_clip: 1.0
max_epochs: 60
patience: 8
lr_patience: 3
lr_factor: 0.2
station_dropout: 0.1
huber_delta: 1.0
pinball_weight: 0.5
seed: 0
max_train_samples: 0   # 0 = all; Kaggle smoke run overrides via a copied YAML
