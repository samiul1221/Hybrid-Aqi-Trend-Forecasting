# Data acquisition + base table config [S09]. Paths are relative to the repo root.
paths:
  cache: data/raw/cache                 # raw HTTP responses (resumable; delete to refetch)
  interim: data/interim                 # per-source IST-hour tables
  base_table: data/processed/base_table # parquet, hive-partitioned by station_id
  data_card: docs/research_notes/data_card.md

period: {start: "2018-01-01", end: "2026-08-31"}   # archive has no 2023-2024 (ADR 0006); splits in sim_params.yaml

region:
  name: Delhi NCT
  bbox: [76.84, 28.40, 77.35, 28.88]    # minLon, minLat, maxLon, maxLat

openaq:
  base_url: https://api.openaq.org/v3
  api_key_env: OPENAQ_API_KEY
  min_interval_s: 1.8                   # 2000 req/h cap binds (60/min would be 3600/h); docs.openaq.org/using-the-api/rate-limits
  page_limit: 1000
  chunk_days: 31
  monitor_only: true                    # reference monitors only
  # CPCB stations are identified by provider name. TODO_VERIFY the exact provider name(s)
  # on the first live run (listed in the data card); AirNow (US Embassy) is excluded.
  provider_name_regex: "(?i)cpcb|caaqm|central pollution"
  parameters: [pm25, pm10, pm1, no2, "no", co, o3, so2, nh3, benzene,   # nox dropped: CPCB NOx < NO+NO2 in most hours (ADR 0006)
               temperature, relativehumidity, wind_speed, wind_direction, pressure]

openaq_archive:                         # keyless S3 source (ADR 0006); used when no API key
  mirror: data/raw/openaq_archive
  workers: 8                            # 16 ran the PC out of memory on 2026-09-26
  # OpenAQ location-id ranges that hold Delhi-NCR reference monitors (found via explore.openaq.org,
  # verified by coordinates on 2026-09-26). Only ids inside region.bbox are kept.
  candidate_ids: [[235, 235], [5530, 5640], [6920, 6970], [8460, 8480], [10480, 10495], [10820, 10835]]
  merge_within_km: 1.0                  # same-name ids closer than this are one station

open_meteo:
  archive_url: https://archive-api.open-meteo.com/v1/archive
  historical_forecast_url: https://historical-forecast-api.open-meteo.com/v1/forecast
  elevation_url: https://api.open-meteo.com/v1/elevation
  min_interval_s: 20                    # free tier 5000/h, 10000/day in WEIGHTED calls: a 1-year request
                                        # counts ~26 (days/14), so >= ~19 s between year-chunks
  archive_model: era5                   # one consistent reanalysis for 2018+ (ADR 0005)
  chunk_days: 366
  # Verified 2026-09-26: names/units below; request timezone=GMT and align ourselves, because
  # timezone=Asia/Kolkata labels the 01:00Z value as 06:00 local (drops the half hour).
  # boundary_layer_height returned null for Delhi in archive and historical-forecast (all models tried).
  hourly: [temperature_2m, relative_humidity_2m, dew_point_2m, surface_pressure,
           wind_speed_10m, wind_direction_10m, precipitation, shortwave_radiation,
           boundary_layer_height]
  accumulated: [precipitation, shortwave_radiation]   # value at T covers (T-1h, T]

cleaning:                               # [S09] base_table_build
  pm25_max: 1500
  pm25_over_pm10_max: 1.05
  flatline_hours: 6
  pm10_max: 3000                        # plausibility cap (CPCB feed holds values up to 7e13; ADR 0009)
  hampel: {window_h: 24, k: 3, mad_floor_ln: 0.2, max_run_h: 3}   # [C06] Hampel on ln(1+PM), labels only (ADR 0009)
  min_bucket_coverage: 0.25             # fraction of an IST hour covered by source data. 0.25 = one CPCB
                                        # 15-min value: CPCB PM is a BAM hourly value repeated over its
                                        # 15-min slots, and 2021-22 holds only 15-min snapshots (ADR 0006).
                                        # Coverage is kept as pm25_cov / pm10_cov in the base table.
  plausible:                            # CPCB met accepted if inside, else Open-Meteo is used
    t: [-5, 50]
    rh: [1, 100]
    p: [850, 1100]
    ws: [0, 30]
