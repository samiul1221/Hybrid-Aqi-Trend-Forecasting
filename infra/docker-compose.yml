# Remote MLOps stack for later (cloud [C04], [C11]). Phase 1 uses the local ZenML stack; this file is not run yet.
# TODO_VERIFY in P9: pin zenml-server tag to the same version as the zenml Python package in uv.lock.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination s3://mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]
    depends_on: [minio]

  zenml:
    image: zenmldocker/zenml-server:TODO_VERIFY
    ports: ["8080:8080"]
    volumes: [zenml-data:/zenml/.zenconfig]

volumes:
  minio-data:
  mlflow-data:
  zenml-data:
