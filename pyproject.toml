[project]
name = "aqi-hybrid"
version = "0.1.0"
description = "Edge-cloud hybrid AQI forecasting (workspace root)"
requires-python = ">=3.11,<3.12"
dependencies = ["aqi-shared", "aqi-ml"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "ml"]

[tool.uv.sources]
aqi-shared = { workspace = true }
aqi-ml = { workspace = true }

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "types-jsonschema==4.26.0.20260518",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["shared/src", "ml/src"]

[[tool.mypy.overrides]]
module = "aqi_shared.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["shared/tests", "ml/tests"]
addopts = "--import-mode=importlib"
