[project]
name = "aqi-forecast"
version = "0.1.0"
description = "Hybrid AQI forecasting prototype: cloud graph teacher -> ESP32 student (notebooks + src/)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx==0.28.1",
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "sensirion-gas-index-algorithm==3.2.2",
    "tensorflow==2.21.0",
    "torch==2.14.1",
]

[tool.uv]
package = false
