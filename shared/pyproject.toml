[project]
name = "aqi-shared"
version = "0.1.0"
description = "Cross-component logic: CPCB AQI, IST time buckets, feature schema, contracts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqi_shared"]
