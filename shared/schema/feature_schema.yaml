# Feature schema [S08] — single source of truth for feature names, order, transforms (invariant I05).
# Schema identity = sha256 of the canonical JSON of this file's parsed content (aqi_shared.schema_loader).
# Any change here changes the hash; models embed the hash and firmware rejects a mismatch.
#
# `tf` is the spec text; `op` is the machine form used by the Python feature builder and C codegen.
# ops: identity | log1p | clip{lo,hi} | offset{value} | scale{value} | log_ratio{base} |
#      base_diff_scale{base,scale} | cyc_sin{period} | cyc_cos{period} | measured_mask

version: 1
lookback_hours: 24          # ablation 48 (E9)
horizons: 3                 # H_OUT [S07]
instnorm_eps: 1.0e-5        # [S13.4] step1
output_order: [pm25_h1, pm25_h2, pm25_h3, pm10_h1, pm10_h2, pm10_h3]   # [S07], CI05
target: "y[p,h] = ln(1+PM_p[t+h]) - ln(1+PM_p[t]); Model B: relative to last valid PM [S14]"

channels:   # [S08.1] sequence channels (CNN input X[24x23]; base for RF features)
  - {i: 0,  name: ln_pm25,      src: pm25_corr,    tf: "ln(1+x)",              op: {log1p: {}},                              instnorm: true,  model_b: false}
  - {i: 1,  name: ln_pm10,      src: pm10_corr,    tf: "ln(1+x)",              op: {log1p: {}},                              instnorm: true,  model_b: false}
  - {i: 2,  name: ln_pm1,       src: pm1,          tf: "ln(1+x)",              op: {log1p: {}},                              instnorm: true,  model_b: false}
  - {i: 3,  name: coarse_ratio, src: coarse_ratio, tf: "clip(0,10)",           op: {clip: {lo: 0, hi: 10}},                  instnorm: true,  model_b: false}
  - {i: 4,  name: t,            src: t,            tf: identity,               op: {identity: {}},                           instnorm: true,  model_b: true}
  - {i: 5,  name: rh,           src: rh,           tf: identity,               op: {identity: {}},                           instnorm: true,  model_b: true}
  - {i: 6,  name: p,            src: p,            tf: "x-1000",               op: {offset: {value: -1000}},                 instnorm: true,  model_b: true}
  - {i: 7,  name: wind_u,       src: wind_u,       tf: identity,               op: {identity: {}},                           instnorm: true,  model_b: true}
  - {i: 8,  name: wind_v,       src: wind_v,       tf: identity,               op: {identity: {}},                           instnorm: true,  model_b: true}
  - {i: 9,  name: rain_frac,    src: rain_frac,    tf: identity,               op: {identity: {}},                           instnorm: false, model_b: true}
  - {i: 10, name: ln_lux,       src: lux,          tf: "ln(1+x)",              op: {log1p: {}},                              instnorm: true,  model_b: true}
  - {i: 11, name: mq7_n,        src: mq7_rs,       tf: "ln(Rs/Rbase7)",        op: {log_ratio: {base: Rbase7}},              instnorm: true,  model_b: true}
  - {i: 12, name: mq135_n,      src: mq135_rs,     tf: "ln(Rs/Rbase135)",      op: {log_ratio: {base: Rbase135}},            instnorm: true,  model_b: true}
  - {i: 13, name: voc_n,        src: sraw_voc,     tf: "(x-base_voc)/1000",    op: {base_diff_scale: {base: base_voc, scale: 0.001}}, instnorm: true, model_b: true}
  - {i: 14, name: nox_n,        src: sraw_nox,     tf: "(x-base_nox)/1000",    op: {base_diff_scale: {base: base_nox, scale: 0.001}}, instnorm: true, model_b: true}
  - {i: 15, name: hod_sin,      src: ist_hour,     tf: "sin(2πh/24)",          op: {cyc_sin: {period: 24}},                  instnorm: false, model_b: true}
  - {i: 16, name: hod_cos,      src: ist_hour,     tf: "cos(2πh/24)",          op: {cyc_cos: {period: 24}},                  instnorm: false, model_b: true}
  - {i: 17, name: dow_sin,      src: ist_dow,      tf: "sin(2πd/7)",           op: {cyc_sin: {period: 7}},                   instnorm: false, model_b: true}
  - {i: 18, name: dow_cos,      src: ist_dow,      tf: "cos(2πd/7)",           op: {cyc_cos: {period: 7}},                   instnorm: false, model_b: true}
  - {i: 19, name: doy_sin,      src: ist_doy,      tf: "sin(2πd/365)",         op: {cyc_sin: {period: 365}},                 instnorm: false, model_b: true}
  - {i: 20, name: doy_cos,      src: ist_doy,      tf: "cos(2πd/365)",         op: {cyc_cos: {period: 365}},                 instnorm: false, model_b: true}
  - {i: 21, name: aqi_now,      src: aqi_pm,       tf: "x/500",                op: {scale: {value: 0.002}},                  instnorm: true,  model_b: false}
  - {i: 22, name: pm_mask,      src: pm_state,     tf: "1 if measured else 0", op: {measured_mask: {}},                      instnorm: false, model_b: false}

calendar_conventions:   # aqi_shared.time_utils.ist_calendar; identical in C
  ist_hour: "0..23 IST"
  ist_dow: "0=Monday .. 6=Sunday"
  ist_doy: "1..366 (Jan 1 = 1)"

unit_baselines:   # [S08.1]; stored in NVS, sent in every record, simulator applies the same
  Rbase7:   {src: mq7_rs,   window_days: 7, quantile: 0.90, note: "Rs high in clean air"}
  Rbase135: {src: mq135_rs, window_days: 7, quantile: 0.90}
  base_voc: {src: sraw_voc, window_days: 7, quantile: 0.90, note: "SGP41 datasheet: VOC ticks fall as VOC rises -> clean air = high"}
  base_nox: {src: sraw_nox, window_days: 7, quantile: 0.10, note: "SGP41 datasheet: NOx ticks rise with NO2 -> clean air = low"}

missing_input_policy:
  interpolate_max_gap_h: 2        # gap <= 2 h: linear interpolation + mask
  training: "gap > 2 h -> window invalid for training"
  inference: "last value + mask"

model_b_extra:   # [S08.2]; computed from the hour before PM was lost
  - {name: last_valid_ln_pm25,     def: "ln(1+pm25_corr[last_valid])"}
  - {name: last_valid_ln_pm10,     def: "ln(1+pm10_corr[last_valid])"}
  - {name: last_valid_aqi,         def: "aqi_pm[last_valid] / 500"}
  - {name: hours_since_pm_lost,    def: "clip(hours, 0, 24) / 24"}
  - {name: pm25_trend_before_loss, def: "ln_pm25[last_valid] - ln_pm25[last_valid - 3h]"}

# [S08.3] RF engineered features, expanded in this order (group order, then op order
# lags -> roll_mean -> roll_std -> diff -> extras). Name pattern: <src>_<op><k>.
# lag k = x[t-k]; roll_mean k = mean(x[t-k+1..t]); roll_std k = population std (ddof=0) of the same;
# diff k = x[t] - x[t-k]; rain_hours_last k = count of hours with rain_flag in x[t-k+1..t].
rf_aux_sources:   # hourly-record values that are not sequence channels
  dust: "dust flag [S06.5] as 0/1"
  wind_speed: "hourly vector-mean wind speed [S06.3]"
  rain_flag: "rain_frac > 0.1 [S06.3]"
rf_features:
  - {src: ln_pm25,      lags: [0, 1, 2, 3, 6, 12, 23], roll_mean: [3, 6, 24], roll_std: [6], diff: [1, 3], pm: true}
  - {src: ln_pm10,      lags: [0, 1, 3], roll_mean: [6, 24], diff: [1], pm: true}
  - {src: ln_pm1,       lags: [0], pm: true}
  - {src: coarse_ratio, lags: [0], pm: true}
  - {src: dust,         lags: [0], pm: true}
  - {src: t,            lags: [0], diff: [3]}
  - {src: rh,           lags: [0], diff: [3]}
  - {src: p,            lags: [0], diff: [3]}
  - {src: wind_u,       lags: [0]}
  - {src: wind_v,       lags: [0]}
  - {src: wind_speed,   roll_mean: [3]}
  - {src: rain_frac,    lags: [0]}
  - {src: rain_flag,    rain_hours_last: [3]}
  - {src: ln_lux,       lags: [0], diff: [1]}
  - {src: mq7_n,        lags: [0], diff: [1]}
  - {src: mq135_n,      lags: [0], diff: [1]}
  - {src: voc_n,        lags: [0], diff: [1]}
  - {src: nox_n,        lags: [0], diff: [1]}
  - {src: hod_sin,      lags: [0]}
  - {src: hod_cos,      lags: [0]}
  - {src: dow_sin,      lags: [0]}
  - {src: dow_cos,      lags: [0]}
  - {src: doy_sin,      lags: [0]}
  - {src: doy_cos,      lags: [0]}
  - {src: aqi_now,      lags: [0], pm: true}
rf_model_b: "drop all groups with pm: true, append model_b_extra in order"
